services:
  voice-api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8081
    env_file: .env
    environment:
      FFMPEG_PATH: /usr/bin/ffmpeg
    ports:
      - "8081:8081"
    volumes:
      - voice_uploads:/app/uploads
      - voice_responses:/app/responses

  toy-api:
    build: .
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:admin@host.docker.internal:5432/chanak}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
    ports:
      - "8000:8000"

volumes:
  voice_uploads:
  voice_responses: